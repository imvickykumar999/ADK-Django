version: '3.8'

services:
  web:
    # Build the image using the Dockerfile in the current directory
    build: .
    # Map port 8000 in the container to port 8000 on your host machine
    ports:
      - "8000:8000"
    # Use restart policy to keep the container running
    restart: always
    # Load environment variables from your .env file
    env_file:
      - .env
    # Optional: Mount your code to the container for live development (remove in full production)
    # volumes:
    #   - .:/usr/src/app
